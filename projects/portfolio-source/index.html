<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本站 · 源码展示</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e0e0e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",monospace,sans-serif;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 48px}
h1{font-size:1.35rem;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:10px}
h1 .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#a855f7);display:inline-block;box-shadow:0 0 12px rgba(99,102,241,.7)}
.sub{color:#8888a0;font-size:.85rem;margin-bottom:18px;line-height:1.6}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{padding:7px 16px;border-radius:20px;font-size:.82rem;font-family:inherit;border:1px solid #2a2a3e;background:#141420;color:#a5b4fc;cursor:pointer;transition:all .2s}
.tab:hover{border-color:#6366f1}
.tab.active{background:#6366f1;border-color:#6366f1;color:#fff}
.panel{display:none}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.iframe-box{border:1px solid #252535;border-radius:14px;overflow:hidden;background:#fff;height:68vh}
.iframe-box iframe{width:100%;height:100%;border:none;display:block}
.file-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:#8888a0;font-size:.8rem}
.file-head b{color:#a5b4fc;font-weight:600}
.copy-btn{padding:4px 12px;border-radius:8px;font-size:.75rem;font-family:inherit;border:1px solid #2a2a3e;background:transparent;color:#8888a0;cursor:pointer;transition:all .2s}
.copy-btn:hover{color:#fff;border-color:#6366f1}
.code{background:#101018;border:1px solid #252535;border-radius:12px;padding:16px;overflow:auto;max-height:68vh;font-size:.78rem;line-height:1.55;color:#d8d8e8;white-space:pre;tab-size:4}
.code .hl{color:#a5b4fc}
.loading,.error{color:#8888a0;text-align:center;padding:60px 20px;font-size:.9rem}
.error{color:#f87171}
.note{color:#5a5a70;font-size:.75rem;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>个人作品集 · 本站</h1>
  <p class="sub">这个页面由作品集本身的源码文件组成——实时预览 + 构成文件的代码展示，自己展示自己。</p>

  <div class="tabs" id="tabs">
    <button class="tab active" data-target="live">实时预览</button>
    <button class="tab" data-file="index.html">index.html</button>
    <button class="tab" data-file="js/vendor/tailwindcss.js">js/vendor/tailwindcss.js</button>
    <button class="tab" data-file="js/vendor/iconify-icon.min.js">js/vendor/iconify-icon.min.js</button>
    <button class="tab" data-file="projects.json">projects.json</button>
  </div>

  <div class="panel active" id="panel-live">
    <div class="iframe-box"><iframe id="liveFrame" src="../../index.html" title="本站实时预览" loading="lazy"></iframe></div>
    <p class="note">↑ 上方是本站真实页面，点击卡片可继续打开各项目预览。</p>
  </div>
  <div class="panel" id="panel-file">
    <div class="file-head"><b id="fileName"></b><button class="copy-btn" id="copyBtn">复制</button></div>
    <pre class="code" id="codeBox"><div class="loading">加载中...</div></pre>
  </div>
</div>

<script>
(function () {
  var tabs = document.getElementById('tabs');
  var livePanel = document.getElementById('panel-live');
  var filePanel = document.getElementById('panel-file');
  var fileName = document.getElementById('fileName');
  var codeBox = document.getElementById('codeBox');
  var copyBtn = document.getElementById('copyBtn');
  var currentSource = '';

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function highlight(s) {
    return escapeHtml(s)
      .replace(/(\/\/[^\n]*)/g, '<span class="hl">$1</span>')
      .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g, '<span class="hl">$1</span>');
  }

  function showFile(name) {
    fileName.textContent = name;
    codeBox.innerHTML = '<div class="loading">加载中...</div>';
    fetch('../../' + name + '?t=' + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (text) {
        currentSource = text;
        codeBox.innerHTML = highlight(text);
        copyBtn.style.display = '';
      })
      .catch(function (err) {
        currentSource = '';
        codeBox.innerHTML = '<div class="error">无法加载 ' + name + '（' + err.message + '）<br><br>提示：请通过本地服务器（npm run dev）或线上部署地址访问本站，源码展示需要 HTTP 环境。</div>';
        copyBtn.style.display = 'none';
      });
  }

  tabs.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
    btn.classList.add('active');
    livePanel.classList.toggle('active', btn.dataset.target === 'live');
    filePanel.classList.toggle('active', !!btn.dataset.file);
    if (btn.dataset.file) showFile(btn.dataset.file);
  });

  copyBtn.addEventListener('click', function () {
    if (!currentSource) return;
    navigator.clipboard.writeText(currentSource).then(function () {
      copyBtn.textContent = '已复制';
      setTimeout(function () { copyBtn.textContent = '复制'; }, 1200);
    }).catch(function () {});
  });
})();
</script>
</body>
</html>
