# 临时探针：验证默认 GITHUB_TOKEN 能否跨仓 checkout 公开仓库。
# 结论出来后本文件即删除。
name: probe-cross-repo-checkout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Cross-repo checkout of public repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repo (portfolio)
        uses: actions/checkout@v7

      - name: Checkout space-kill-web (public) with DEFAULT token
        id: xr
        uses: actions/checkout@v7
        with:
          repository: hxj-2888/space-kill-web
          sparse-checkout: attachment-site/site
          sparse-checkout-cone-mode: true
          persist-credentials: false

      - name: Report
        run: |
          echo "---- 跨仓 checkout 结果 ----"
          if [ -d attachment-site/site ]; then
            echo "文件数: $(ls attachment-site/site | wc -l)"
            echo "mc 报告存在: $([ -f attachment-site/site/mc-10000.html ] && echo yes || echo no)"
            grep -o '耗时</td><td>[^<]*' attachment-site/site/mc-10000.html | head -1
          else
            echo "目录缺失 —— 跨仓 checkout 失败"
            exit 1
          fi

      - name: Report repo identities
        run: |
          echo "当前仓: $GITHUB_REPOSITORY"
          echo "可用 API 读 space-kill-web: $(curl -s -o /dev/null -w '%{http_code}' https://api.github.com/repos/hxj-2888/space-kill-web)"

      - name: Can we PUSH to the other repo with default token?
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST "https://api.github.com/repos/hxj-2888/space-kill-web/git/refs" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -d '{"ref":"refs/heads/__probe_should_not_exist","sha":"0000000000000000000000000000000000000000"}')
          echo "对 space-kill-web 写权限探测 HTTP: $code （403/404=无权限，符合预期）"