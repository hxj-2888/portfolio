# ===== GitHub Actions — Cloudflare Pages 自动部署（作品集）=====
# 触发: push 到 main（或手动 workflow_dispatch）
# 效果: 自动部署 Cloudflare Pages 正式版（portfolio-ji）
# 依赖 GitHub Secrets（Settings → Secrets and variables → Actions，值与 delta-force-price-query 仓库相同）:
#   CF_API_TOKEN     Cloudflare API Token（需含 Pages Edit 权限）
#   CF_ACCOUNT_ID    Cloudflare 账户 ID
# 静态资源排除由根目录 .assetsignore 控制（.env*/keystore 等不会上传）。

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===== 质量门禁: JS 语法检查 + JSON 配置校验 =====
  check:
    name: Syntax & config check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check all JS
        run: |
          find js scripts -name '*.js' -not -path 'js/vendor/*' -print0 | xargs -0 -n1 node --check
          node --check build-collect.js
          node --check sync-projects.js

      - name: Validate JSON configs
        run: |
          node -e "JSON.parse(require('fs').readFileSync('projects.json','utf8')); console.log('projects.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('sync.json','utf8')); console.log('sync.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('projects/delta-force/manifest.json','utf8')); console.log('delta-force manifest OK')"

  # ===== Cloudflare Pages 正式版（portfolio-ji, 生产分支 main）=====
  deploy-cloudflare:
    name: Cloudflare Pages (production)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ★ 白名单暂存：wrangler pages deploy 不支持 .assetsignore，
      #   只复制确定的站点文件部署，其余（笔记/脚本/.github/配置）永远不公开
      - name: Stage site files (allowlist)
        run: |
          mkdir -p /tmp/site-deploy
          cp -r index.html projects.json css js assets projects functions wrangler.toml /tmp/site-deploy/
          find /tmp/site-deploy -maxdepth 1 -type f | sort

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy /tmp/site-deploy --project-name=portfolio-ji --branch=main --commit-hash=${{ github.sha }}

  # ===== 部署后冒烟验证: 首页 / 项目数据 / 内嵌预览可达 =====
  smoke-test:
    name: Post-deploy smoke test
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: 作品集首页
        run: curl -fsSL -o /dev/null --max-time 30 "https://portfolio-ji.pages.dev/"

      - name: 项目数据 projects.json
        run: curl -fsSL --max-time 30 "https://portfolio-ji.pages.dev/projects.json" | head -c 200

      - name: 内嵌三角洲预览
        run: curl -fsSL --max-time 30 "https://portfolio-ji.pages.dev/projects/delta-force/" | head -c 200
