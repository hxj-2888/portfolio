# ===== GitHub Actions — Cloudflare Pages 自动部署（作品集）=====
# 触发: push 到 main（或手动 workflow_dispatch）
# 效果: 自动部署 Cloudflare Pages 正式版（portfolio-ji）
# 依赖 GitHub Secrets（Settings → Secrets and variables → Actions，值与 delta-force-price-query 仓库相同）:
#   CF_API_TOKEN     Cloudflare API Token（需含 Pages Edit 权限）
#   CF_ACCOUNT_ID    Cloudflare 账户 ID
# 静态资源排除由根目录 .assetsignore 控制（.env*/keystore 等不会上传）。

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===== 质量门禁: JS 语法检查 + JSON 配置校验 =====
  check:
    name: Syntax & config check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Syntax check all JS
        run: |
          find js scripts -name '*.js' -not -path 'js/vendor/*' -print0 | xargs -0 -n1 node --check
          node --check build-collect.js
          node --check sync-projects.js

      - name: Validate JSON configs
        run: |
          node -e "JSON.parse(require('fs').readFileSync('projects.json','utf8')); console.log('projects.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('sync.json','utf8')); console.log('sync.json OK')"
          node -e "JSON.parse(require('fs').readFileSync('projects/delta-force/manifest.json','utf8')); console.log('delta-force manifest OK')"

  # ===== Cloudflare Pages 正式版（portfolio-ji, 生产分支 main）=====
  deploy-cloudflare:
    name: Cloudflare Pages (production)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ★ 白名单暂存：wrangler pages deploy 不支持 .assetsignore，
      #   只复制确定的站点文件部署，其余（笔记/脚本/.github/配置）永远不公开
      #   注意 1：不含 wrangler.toml——deploy 读的是当前工作目录的配置，
      #   把它上传只会公开 D1 database_id / KV namespace id，无任何必要
      #   注意 2：必须带 _headers——漏了它 CI 部署会把线上的安全响应头
      #   （X-Frame-Options / HSTS / CSP）一并清掉（2026-09-13 实测踩过），
      #   本地部署脚本 deploy-cloudflare.ps1 的白名单里一直有它，两处需保持一致
      #   注意 3：【2026-10-24 改】projects/game-collection/games/ 原先被 .gitignore
      #   排除，CI checkout 后为空，线上合集 games/ 只剩 SPA 回退，合集实际打不开。
      #   现改为将同步产物入库（约 9.8 MB）。
      #
      # ★ 自动同步校验（取代原「仅检查存在」）：
      #   CI 没有 ../乒乓对决_合并 这类兄弟目录，故把两个源仓库 clone 到临时目录，
      #   用 sync-projects.js --src-root 在临时副本上重跑同步，再与本仓库已入库的
      #   projects/ 比对。一致 = 本地没忘记同步；不一致 = 有人改了游戏但没跑
      #   node sync-projects.js 就提交，此时明确报错而不是让旧版静默上线。
      - name: Clone source repos for sync verification
        run: |
          ws="$RUNNER_TEMP/sync-ws"
          mkdir -p "$ws/portfolio-copy"
          # sync.json 的 sourceDir 是相对 portfolio 根目录的 ../X，所以源仓库
          # 必须落在与 portfolio 同级的目录下；--src-root 指向 portfolio-copy。
          git clone --depth 1 https://github.com/hxj-2888/ping-pong-duel.git "$ws/乒乓对决_合并"
          git clone --depth 1 https://github.com/hxj-2888/space-kill-web.git "$ws/太空杀游戏-完整版"
          git clone --depth 1 https://github.com/hxj-2888/delta-force-price-query.git "$ws/delta-force-deploy"
          echo "SYNC_WS=$ws" >> "$GITHUB_ENV"
          ls -1 "$ws"

      - name: Re-sync from sources into a scratch copy
        run: |
          ws="$SYNC_WS"
          cp -r sync.json sync-projects.js "$ws/portfolio-copy/"
          mkdir -p "$ws/portfolio-copy/projects"
          # 从本仓库已入库的 projects/ 出发，重跑同步后看是否有差异
          cp -r projects "$ws/portfolio-copy/"
          cd "$ws/portfolio-copy"
          # --src-root 指向副本目录自身：sync.json 的 sourceDir 是 ../X，
          # 于是解析为 $ws/X，正好是上面 clone 下来的源仓库位置。
          node sync-projects.js --src-root="$ws/portfolio-copy" 2>&1 | tail -20

      - name: Verify committed projects/ is up to date with upstream
        run: |
          fail=0
          # 比对本仓库入库的副本与 CI 从源仓库重跑同步的结果
          for rel in ping-pong-duel/js/render.js \
                     ping-pong-duel/js/app/render.js \
                     ping-pong-duel/js/boot.js \
                     game-collection/games/ping-pong/js/render.js \
                     game-collection/games/ping-pong/js/app/render.js; do
            a="projects/$rel"
            b="$SYNC_WS/portfolio-copy/projects/$rel"
            if [ ! -f "$a" ] || [ ! -f "$b" ]; then
              echo "::error::缺少 $rel（仓库内或同步结果）"; fail=1; continue
            fi
            ha=$(tr -d '\r' < "$a" | sha256sum | cut -d' ' -f1)
            hb=$(tr -d '\r' < "$b" | sha256sum | cut -d' ' -f1)
            if [ "$ha" != "$hb" ]; then
              echo "::error::$rel 落后于源仓库——请本地运行 node sync-projects.js 后提交。"
              echo "  仓库内 ${ha:0:12}"
              echo "  源仓库 ${hb:0:12}"
              fail=1
            else
              echo "✓ $rel 与源一致（${ha:0:12}）"
            fi
          done
          exit $fail

      # ★ 一致性校验：合集里的乒乓副本与独立副本必须同源。
      #   （已由上面的「重跑同步并与源比对」覆盖，这里保留一份轻量互校，
      #     用于同步脚本本身出问题时的兜底——两者不一致说明产物被手工改过。）
      #   ⚠ 先 tr -d '\r' 归一换行符，避免 Windows/Linux 换行差异造成假红灯。
      - name: Cross-check collection vs standalone copies
        run: |
          fail=0
          for rel in js/render.js js/app/render.js; do
            a="projects/ping-pong-duel/$rel"
            b="projects/game-collection/games/ping-pong/$rel"
            if [ ! -f "$a" ] || [ ! -f "$b" ]; then
              echo "::error::缺少 $rel（独立副本或合集副本不存在）"; fail=1; continue
            fi
            ha=$(tr -d '\r' < "$a" | sha256sum | cut -d' ' -f1)
            hb=$(tr -d '\r' < "$b" | sha256sum | cut -d' ' -f1)
            if [ "$ha" != "$hb" ]; then
              echo "::error::$rel 两份副本不一致——产物被手工改过或同步不完整。"
              echo "  独立副本 ${ha:0:12}"
              echo "  合集副本 ${hb:0:12}"
              fail=1
            else
              echo "✓ $rel 两份副本一致（${ha:0:12}）"
            fi
          done
          exit $fail

      - name: Stage site files (allowlist)
        run: |
          mkdir -p /tmp/site-deploy
          cp -r index.html projects.json _headers js css assets projects functions /tmp/site-deploy/
          find /tmp/site-deploy -maxdepth 1 -type f | sort

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy /tmp/site-deploy --project-name=portfolio-ji --branch=main --commit-hash=${{ github.sha }}

  # ===== 部署后冒烟验证: 首页 / 项目数据 / 内嵌预览可达 =====
  smoke-test:
    name: Post-deploy smoke test
    needs: deploy-cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: 作品集首页
        run: curl -fsSL -o /dev/null --max-time 30 "https://portfolio-ji.pages.dev/"

      - name: 项目数据 projects.json
        run: curl -fsSL --max-time 30 "https://portfolio-ji.pages.dev/projects.json" | head -c 200

      - name: 内嵌三角洲预览
        run: curl -fsSL --max-time 30 "https://portfolio-ji.pages.dev/projects/delta-force/" | head -c 200

      # 回归门禁：_headers 若漏进部署暂存，线上会静默丢失安全响应头（2026-09-13 踩过）
      - name: 安全响应头 _headers 生效
        run: |
          H=$(curl -fsSI --max-time 30 "https://portfolio-ji.pages.dev/")
          for k in "Content-Security-Policy" "X-Frame-Options" "Strict-Transport-Security"; do
            echo "$H" | grep -qi "^$k:" || { echo "缺少响应头: $k（_headers 未部署）"; exit 1; }
          done
          echo "_headers OK"

  # ===== 失败通知：创建/关闭 Issue =====
  # 背景：2026-10-23 乒乓站点 CI 失败后未部署，站点静默停在旧版一天无人发现。
  # 这里在工作流失败时自动开 Issue（带失败 job、提交、链接），成功后自动关闭，
  # 让「部署挂了」在 GitHub 站内可见，而不只依赖容易被忽略的邮件。
  # 不需要任何外部凭据，只需 issues: write 权限。
  # 成功时自动关闭遗留的失败 Issue（恢复通知）。
  close-failure-issue:
    name: Close stale failure issue
    if: success()
    needs: [check, deploy-cloudflare, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close open deploy-failure issues
        uses: actions/github-script@v8
        with:
          script: |
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-failure',
            });
            for (const issue of open.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ 已恢复：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
              });
              core.info(`已关闭 #${issue.number}`);
            }

  notify:
    name: Notify on failure
    if: always() && contains(needs.*.result, 'failure')
    needs: [check, deploy-cloudflare, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update failure issue
        uses: actions/github-script@v8
        with:
          script: |
            const results = ${{ toJSON(needs) }};
            const failed = Object.entries(results)
              .filter(([, v]) => v.result === 'failure')
              .map(([k]) => k);
            const title = `🚨 部署失败：${context.workflow}（${context.ref_name}）`;
            const body = [
              `**工作流**：${context.workflow}`,
              `**分支**：${context.ref_name}`,
              `**失败 job**：${failed.join('、') || '（未知）'}`,
              `**提交**：${context.sha.slice(0, 7)} — ${context.payload.head_commit?.message?.split('\n')[0] ?? '-'}`,
              `**运行记录**：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '> 处理完成后本 Issue 会在下次成功部署时自动关闭。',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'deploy-failure',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
              core.info(`已追加评论到 #${existing.data[0].number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['deploy-failure'],
              });
              core.info(`已创建 Issue #${created.data.number}`);
            }
