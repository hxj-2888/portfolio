name = "portfolio"
pages_build_output_dir = "."

# Pages Functions 运行时兼容标志。
# 必须显式声明：wrangler v4（wrangler-action v4 的默认 CLI）在缺少 compatibility_date
# 时会注入引用 node: 内置模块的运行时 shim，Functions 打包随即失败
# （"No such module node:stream"）。开启 nodejs_compat 后可正常解析。
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 数据库（价格历史存储）
[[d1_databases]]
binding = "DB"
database_name = "delta-force-prices"
database_id = "b1a4f06e-4236-4a79-9ab4-1cd0fa72b224"

# KV 命名空间（元数据动态刷新）
[[kv_namespaces]]
binding = "METADATA_KV"
id = "252ac6dfa5ab47f491d6f5752abae6db"
